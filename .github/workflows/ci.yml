name: framework-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  framework-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Verify Ruff formatting
        run: uv run --frozen ruff format --check src tests

      - name: Run Ruff lint checks
        run: uv run --frozen ruff check src tests

      - name: Run Mypy
        run: uv run --frozen mypy

      - name: Verify public schema compatibility snapshots
        run: uv run --frozen pytest tests/test_schema_compatibility.py

      - name: Validate three-agent definitions
        run: uv run --frozen legacy-migration-agent agents-check --project-root .

      - name: Run framework tests
        run: >-
          uv run --frozen pytest
          --basetemp=${{ runner.temp }}/legacy-migration-framework-pytest

      - name: Verify compact evaluation declaration
        run: >-
          uv run --frozen legacy-migration-agent evaluation-verify
          --registry evaluation/benchmark-v1/registry.json
          --results evaluation/results.json

      - name: Verify the bounded agent-run pilot snapshot
        run: >-
          uv run --frozen legacy-migration-agent evaluation-pilot-verify
          --project-root .
          --registry evaluation/pilot-v1/registry.json
          --snapshot-dir evaluation/pilot-v1

  agent-runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install locked Python dependencies
        run: uv sync --frozen --extra dev

      - name: Verify current agent runtime and final-review contracts
        run: >-
          uv run --frozen pytest
          --basetemp=${{ runner.temp }}/legacy-migration-contracts-pytest
          tests/test_agent_run.py
          tests/test_final_review.py
          tests/test_model_workflow.py
