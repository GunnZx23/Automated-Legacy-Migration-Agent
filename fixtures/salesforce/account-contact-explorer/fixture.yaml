schema_version: "1.0"
fixture_id: salesforce-account-contact-explorer
title: Account Contact Explorer
platform: salesforce
public_synthetic: true
api_version: "67.0"
migration_kind: visualforce_to_lwc

source:
  root: input
  entrypoint: force-app/main/default/pages/LegacyAccountContactExplorer.page
  controller: force-app/main/default/classes/LegacyAccountContactExplorerController.cls
  unit_test: force-app/main/default/classes/LegacyAccountContactExplorerControllerTest.cls
  permission_set: force-app/main/default/permissionsets/AccountContactExplorerUser.permissionset-meta.xml

expected:
  root: expected
  component: force-app/main/default/lwc/accountContactExplorer
  controller: force-app/main/default/classes/AccountContactExplorerController.cls
  unit_test: force-app/main/default/classes/AccountContactExplorerControllerTest.cls
  jest_test: force-app/main/default/lwc/accountContactExplorer/__tests__/accountContactExplorer.test.js
  permission_set: force-app/main/default/permissionsets/AccountContactExplorerUser.permissionset-meta.xml
  package_manifest: manifest/package.xml
  preserved_legacy_files:
    - sfdx-project.json
    - force-app/main/default/pages/LegacyAccountContactExplorer.page
    - force-app/main/default/pages/LegacyAccountContactExplorer.page-meta.xml
    - force-app/main/default/classes/LegacyAccountContactExplorerController.cls
    - force-app/main/default/classes/LegacyAccountContactExplorerController.cls-meta.xml
    - force-app/main/default/classes/LegacyAccountContactExplorerControllerTest.cls
    - force-app/main/default/classes/LegacyAccountContactExplorerControllerTest.cls-meta.xml
  added_files:
    - package.json
    - package-lock.json
    - jest.config.js
    - manifest/package.xml
    - force-app/main/default/classes/AccountContactExplorerController.cls
    - force-app/main/default/classes/AccountContactExplorerController.cls-meta.xml
    - force-app/main/default/classes/AccountContactExplorerControllerTest.cls
    - force-app/main/default/classes/AccountContactExplorerControllerTest.cls-meta.xml
    - force-app/main/default/lwc/accountContactExplorer/accountContactExplorer.html
    - force-app/main/default/lwc/accountContactExplorer/accountContactExplorer.js
    - force-app/main/default/lwc/accountContactExplorer/accountContactExplorer.css
    - force-app/main/default/lwc/accountContactExplorer/accountContactExplorer.js-meta.xml
    - force-app/main/default/lwc/accountContactExplorer/__tests__/accountContactExplorer.test.js
    - force-app/main/default/lwc/accountContactExplorer/__tests__/data/accounts.json
    - force-app/main/default/lwc/accountContactExplorer/__tests__/data/contacts.json
  modified_files:
    - force-app/main/default/permissionsets/AccountContactExplorerUser.permissionset-meta.xml
  destructive_changes: []
  retirement_candidates:
    - force-app/main/default/pages/LegacyAccountContactExplorer.page
    - force-app/main/default/pages/LegacyAccountContactExplorer.page-meta.xml
    - force-app/main/default/classes/LegacyAccountContactExplorerController.cls
    - force-app/main/default/classes/LegacyAccountContactExplorerController.cls-meta.xml
    - force-app/main/default/classes/LegacyAccountContactExplorerControllerTest.cls
    - force-app/main/default/classes/LegacyAccountContactExplorerControllerTest.cls-meta.xml

behavior:
  accounts:
    maximum: 50
    order_by:
      - Name ASC
    includes_blank_option: true
  contacts:
    maximum: 100
    order_by:
      - LastName ASC
      - FirstName ASC
    fields:
      - FirstName
      - LastName
      - Email
      - Phone
  interaction:
    explicit_load_button: true
    load_disabled_without_selection: true
    blank_selection_warning: true
    empty_contact_state: true
    loading_state: true
    controlled_error_state: true
    stale_response_ignored_after_selection_change: true

security:
  sharing_model: with_sharing
  query_access_mode: user_mode
  standard_objects_only:
    - Account
    - Contact
  permission_set_access: read_only
  dml_allowed: false
  external_calls: false
  secrets: false

validation:
  local_required:
    - id: fixture-structure
      assertion: Every declared path exists below its declared root.
    - id: legacy-preservation
      assertion: Every preserved legacy artifact is byte-for-byte identical in input and expected.
    - id: lwc-jest
      assertions:
        - Out-of-order imperative Apex responses cannot replace data for the current Account selection.
      working_directory: expected
      install_command: npm ci
      command: npm run test:unit
  org_required_for_deployment_claim:
    - id: apex-tests
      tests:
        - LegacyAccountContactExplorerControllerTest
        - AccountContactExplorerControllerTest
      assertions:
        - Account results are ordered and capped at 50.
        - Contact results are filtered by Account, ordered by LastName then FirstName, and capped at 100.
    - id: metadata-validation
      manifest: expected/manifest/package.xml
  final_state: ready_for_human_review

decision_required:
  action: destructive_change
  condition: Retire any legacy artifact after side-by-side acceptance.

acceptance:
  - All version-bearing Salesforce metadata and project/package manifests use API version 67.0.
  - The LWC is exposed on Lightning App pages and as a Lightning tab.
  - The expected permission set grants read but no create, edit, or delete access.
  - Null Account selection returns no contacts and never issues an unbounded query.
  - No production, deployment, commit, push, or destructive action is implied.
