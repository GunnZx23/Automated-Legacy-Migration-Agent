<template>
    <lightning-card title="Account Contact Explorer" icon-name="standard:account">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium controls">
            <lightning-combobox
                name="account"
                label="Account"
                value={selectedAccountId}
                options={accountOptions}
                onchange={handleAccountChange}>
            </lightning-combobox>
            <lightning-button
                class="load-button"
                label="Load Contacts"
                variant="brand"
                disabled={isLoadDisabled}
                onclick={handleLoad}>
            </lightning-button>
        </div>

        <template lwc:if={warningMessage}>
            <div class="slds-p-horizontal_medium slds-p-bottom_small warning" role="alert">
                {warningMessage}
            </div>
        </template>

        <template lwc:if={errorMessage}>
            <div class="slds-p-horizontal_medium slds-p-bottom_small slds-text-color_error error" role="alert">
                {errorMessage}
            </div>
        </template>

        <template lwc:if={isLoading}>
            <div class="loading-region">
                <lightning-spinner alternative-text="Loading contacts" size="small">
                </lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={hasContacts}>
            <lightning-datatable
                key-field="Id"
                data={contacts}
                columns={columns}
                hide-checkbox-column>
            </lightning-datatable>
        </template>

        <template lwc:elseif={showEmptyState}>
            <p class="slds-p-horizontal_medium slds-p-bottom_medium empty-state">
                No contacts were found for the selected account.
            </p>
        </template>
    </lightning-card>
</template>
