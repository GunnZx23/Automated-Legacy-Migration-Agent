[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "legacy-migration-agent"
version = "0.1.0"
description = "Evidence-producing, human-gated legacy migration workflow for Salesforce and MuleSoft"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gurleen Singh" }]
dependencies = [
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
  "types-pyyaml==6.0.12.20260815",
]
model = [
  "openai==3.3.1",
]

[project.scripts]
legacy-migration-agent = "legacy_migration_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legacy_migration_agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/legacy_migration_agent"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "openai.*"]
ignore_missing_imports = true
